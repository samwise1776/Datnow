<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple GitHub Store</title>
</head>
<body>

    <h3>Open your browser console (F12) to call the function!</h3>
    <p>Type: <code>store("Hello World")</code> into the console line.</p>

    <script>
        // --- CONFIGURATION ---
        const TOKEN = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"; 
        const REPO = "samwise1776/Datnow";
        const FILE_PATH = "posts.txt"; 

        // --- GLOBAL STORE FUNCTION ---
        async function store(textData) {
            console.log(`Attempting to store: "${textData}"...`);
            const apiUrl = `https://github.com/${REPO}/contents/${FILE_PATH}`;
            let fileSha = null;

            // Step 1: Check if the file exists to get its unique SHA ID
            try {
                const res = await fetch(apiUrl, {
                    headers: { "Authorization": `Bearer ${TOKEN}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.sha; 
                }
            } catch (e) {
                console.log("File doesn't exist yet. Creating a brand new one.");
            }

            // Step 2: Convert your plain text payload into Base64 format
            const base64Content = btoa(textData);

            // Step 3: Package the commit payload
            const payload = {
                message: `Update text data via store()`,
                content: base64Content,
                branch: "main"
            };
            if (fileSha) payload.sha = fileSha; // Attach SHA if overwriting an existing file

            // Step 4: Push it up to your repository
            try {
                const response = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `Bearer ${TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    console.log("Successfully saved to GitHub!");
                } else {
                    const err = await response.json();
                    console.error("Failed to save:", err.message);
                }
            } catch (error) {
                console.error("Network error:", error.message);
            }
        }
    </script>
</body>
</html>
