
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datnow</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0d1117;
  color: #e6edf3;
  font-family: system-ui, sans-serif;
}
header {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 20px;
  font-size: 26px;
  font-weight: bold;
  color: #58a6ff;
}
main { max-width: 720px; margin: auto; padding: 20px; }
.post, .panel {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
}
.post p { white-space: pre-wrap; overflow-wrap: anywhere; }
small { color: #8b949e; }
input {
  width: 100%;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 8px;
  color: white;
  padding: 13px;
  font: inherit;
}
button, .button {
  background: #238636;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  color: white;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  margin: 5px 5px 5px 0;
}
button:hover, .button:hover { filter: brightness(1.15); }

textarea {
  width: 100%;
  min-height: 130px;
  margin-top: 10px;
  padding: 12px;
  border-radius: 8px;
  background: #0d1117;
  color: white;
  border: 1px solid #30363d;
  font: inherit;
  resize: vertical;
}
#composer input { margin-top: 10px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>◆ Datnow</header>
<main>
  <section class="panel">
    <h2>Welcome to Datnow!</h2>
    <p>Share your thoughts with the world.</p>
    <button onclick="document.getElementById('composer').hidden = !document.getElementById('composer').hidden">
      Create post
    </button>
    <section id="composer" class="panel" hidden>
      <h3>New post</h3>
      <input id="post-user" maxlength="32" placeholder="Username">
      <textarea id="post-content" maxlength="2000" placeholder="What's on your mind?"></textarea>
      <input id="post-password" type="password" placeholder="Publishing password">
      <button id="publish-button" onclick="publishPost()">Publish</button>
      <p id="publish-status"></p>
    </section>
    <button onclick="loadPosts()">Refresh feed</button>
  </section>

  <input id="search" placeholder="Search posts...">

  <h2>Latest posts</h2>
  <div id="feed">Loading posts...</div>
</main>

<script>
const REPO = "samwise1776/Datnow";
const BRANCH = "master";
const API =
  `https://api.github.com/repos/${REPO}/contents/posts.json?ref=${BRANCH}`;

let posts = [];

async function loadPosts() {
  const feed = document.getElementById("feed");
  feed.textContent = "Loading...";

  try {
    const response = await fetch(API, {
      headers: { Accept: "application/vnd.github+json" },
      cache: "no-store"
    });

    if (!response.ok) throw new Error("HTTP " + response.status);

    const file = await response.json();
    const binary = atob(file.content.replace(/\s/g, ""));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const data = JSON.parse(new TextDecoder().decode(bytes));

    if (Array.isArray(data.posts)) {
      posts = data.posts;
    } else {
      posts = Object.entries(data).map(([key, value]) => ({
        id: key,
        username: key,
        content: typeof value === "string"
          ? value : JSON.stringify(value),
        createdAt: null
      }));
    }

    render();
  } catch (error) {
    feed.textContent = "Unable to load posts: " + error.message;
  }
}

function render() {
  const feed = document.getElementById("feed");
  const search = document.getElementById("search")
    .value.toLowerCase();

  feed.replaceChildren();

  const filtered = posts.filter(post =>
    String(post.username || "").toLowerCase().includes(search) ||
    String(post.content || "").toLowerCase().includes(search)
  ).slice().reverse();

  if (!filtered.length) {
    feed.textContent = "No posts found.";
    return;
  }

  for (const post of filtered) {
    const card = document.createElement("article");
    card.className = "post";

    const name = document.createElement("strong");
    name.textContent = "@" + (post.username || "anonymous");

    const content = document.createElement("p");
    content.textContent = post.content || "";

    const date = document.createElement("small");
    date.textContent = post.createdAt
      ? new Date(post.createdAt).toLocaleString()
      : "Datnow post";

    card.append(name, content, date);
    feed.append(card);
  }
}

document.getElementById("search")
  .addEventListener("input", render);


async function publishPost() {
  const username = document.getElementById("post-user").value.trim();
  const content = document.getElementById("post-content").value.trim();
  const password = document.getElementById("post-password").value;
  const status = document.getElementById("publish-status");
  const button = document.getElementById("publish-button");

  if (!username || !content || !password) {
    status.textContent = "Please fill in all fields.";
    return;
  }

  button.disabled = true;
  status.textContent = "Publishing...";

  try {
    const response = await fetch("https://datnow-api.appalog.workers.dev", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + password
      },
      body: JSON.stringify({ username, content })
    });

    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Publishing failed");

    status.textContent = "✅ Post published!";
    document.getElementById("post-content").value = "";
    document.getElementById("post-password").value = "";
    await loadPosts();
  } catch (error) {
    status.textContent = "❌ " + error.message;
  } finally {
    button.disabled = false;
  }
}

loadPosts();
</script>
</body>
</html>
